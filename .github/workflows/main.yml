
name: Publicar imagenes Docker

on:
  push:
    branches:
      - MAIN

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: kailct141924/portafolio-personal:frontend

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: kailct141924/portafolio-personal:backend
