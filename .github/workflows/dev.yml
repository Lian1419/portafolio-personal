
name: Pipeline DEV - Pruebas automatizadas

on:
  push:
    branches:
      - DEV
  pull_request:
    branches:
      - DEV

jobs:
  pruebas:
    name: Ejecutar pruebas del proyecto
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: portafolio_kail
      DB_PASSWORD: postgres_test_password

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: portafolio_kail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portafolio_kail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Instalar dependencias backend
        run: npm ci
        working-directory: backend

      - name: Ejecutar pruebas backend
        run: npm test
        working-directory: backend

      - name: Compilar frontend
        run: npm run build
