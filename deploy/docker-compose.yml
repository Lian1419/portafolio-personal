services:
  frontend:
    image: kailct141924/portafolio-personal:frontend
    container_name: portafolio_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: kailct141924/portafolio-personal:backend
    container_name: portafolio_backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_NAME: portafolio_kail
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: portafolio_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: portafolio_kail
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portafolio_kail"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:



